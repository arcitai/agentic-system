 1)"><rect x="0" y="0" width="520" height="155" rx="16" fill="#f8f9fc" stroke="#bdcbea" stroke-width="1.5"/><text x="24" y="46" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202733"><tspan x="24" dy="0">Native credential broker</tspan></text><text x="24" y="84" font-family="Inter,system-ui,sans-serif" font-size="18" text-anchor="start" fill="#5e6a7b"><tspan x="24" dy="0">Real credentials stay outside execution</tspan><tspan x="24" dy="22.5">boundaries</tspan></text></g><rect x="1070" y="600" width="322" height="176" fill="none"/><g transform="translate(1070 600) scale(1 1)"><rect x="0" y="0" width="322" height="176" rx="16" fill="#f1f5ff" stroke="#bdcbea" stroke-width="1.5"/><text x="24" y="46" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202733"><tspan x="24" dy="0">Project services</tspan></text><text x="24" y="84" font-family="Inter,system-ui,sans-serif" font-size="18" text-anchor="start" fill="#5e6a7b"><tspan x="24" dy="0">Only granted GitHub /</tspan><tspan x="24" dy="22.5">Notion</tspan><tspan x="24" dy="22.5">or other project-service</tspan><tspan x="24" dy="22.5">actions</tspan></text></g><g transform="translate(677.5 450)"><path d="M0 0L0 75L57.5 75L57.5 150" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M57.5 150L54.02 142.8L60.98 142.8Z" fill="#2563eb"/><text x="-26.25" y="39" font-family="Inter,system-ui,sans-serif" font-size="14" text-anchor="start" fill="#5e6a7b"><tspan x="-26.25" dy="0">scoped request</tspan></text></g><g transform="translate(995 677.5)"><path d="M0 0L37.5 0L37.5 10.5L75 10.5" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 10.5L67.8 13.98L67.8 7.02Z" fill="#2563eb"/><text x="-17.5" y="-30.75" font-family="Inter,system-ui,sans-serif" font-size="14" text-anchor="start" fill="#5e6a7b"><tspan x="-17.5" dy="0">authorized</tspan><tspan x="-17.5" dy="17.5">request</tspan></text></g><text x="48" y="832" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#2563eb"><tspan x="48" dy="0">Z13 / PROJECT-SCOPED EXECUTION</tspan></text><text x="48" y="892" font-family="Inter,system-ui,sans-serif" font-size="22" text-anchor="start" fill="#5e6a7b"><tspan x="48" dy="0">A fresh context or worktree is not a credential boundary. Separate helper environments receive no project</tspan><tspan x="48" dy="27.5">connection by default.</tspan></text></g></g></svg>