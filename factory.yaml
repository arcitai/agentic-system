# Factory Lab declaration; version 0.7.
# Interpreted by AgentOps; not applied configuration.
# Native tools enforce only what is configured and verified in them.
# This file grants no authority or access and does not override existing holds.
# Inspired by Warp Factories; not their schema or a compatible Warp definition.
# Reference: https://www.warp.dev/blog/the-factory-stack
definition_version: "0.7"
name: arcitai-factory-lab
description: Develop, qualify and publish the portable Factory method.
status: candidate

context:
  home: https://gustavanderson.notion.site/Factory-a-practical-guide-4046d2e17f568159a603de2dd6b91c2a
  skills: https://gustavanderson.notion.site/5e1552911ffc42b8a999609cc6847a00
  work: https://github.com/arcitai/factory/issues
  native_artifacts: https://github.com/arcitai/factory
  lead_source_access: factory-pages-read-update-insert
  worker_context: selected-versioned-skill-and-context-files
  upstream_credentials: native-broker-outside-execution-boundary

workspace:
  selected: t3-code  # Lab choice, not a method requirement
  channel: stable  # stable preferred; Lab moved to it on 29 October 2026 (#34)
  candidate_version: 0.1.6
  environments: separate-project-lead-and-narrower-worker-environments
  shared_environment: explicit-trusted-related-projects-only
  operator_view: one-native-gui
  qualification: required-for-selected-capabilities

models:  # Gustav's selected Lab choices, not universal Factory requirements
  implementation:
    model: claude-sonnet-5-5
    effort: high
    fast_mode: false
  routine_work:
    model: claude-sonnet-5-5
    effort: high
  specification:
    model: claude-opus-5-5
    effort: high
    fast_mode: false
  review:
    model: claude-opus-5-5
    effort: high
    fast_mode: false
  optional_gpt:
    model: gpt-6.1-sol
    effort: high
    status: not-qualified-in-lab
  apply: next-safe-task-boundary

agents:
  lead:
    skill: https://gustavanderson.notion.site/4056d2e17f56819cbe9df834bc7819f0
    briefing: https://gustavanderson.notion.site/40d6d2e17f568162ac85eb119ef33a2b  # shared method from #117; authoring edition
  foundation:
    skill: https://gustavanderson.notion.site/4056d2e17f5681edb778c29cc5faa9a0
  evaluator:
    skill: https://gustavanderson.notion.site/4056d2e17f5681e1b1b7d2bc2b5d783c

work_modules:
  software:
    skills:
      triage: https://gustavanderson.notion.site/4056d2e17f5681668e80d9aa3cccdf61  # released reference 0.1.4
      specify: https://gustavanderson.notion.site/4056d2e17f568177aee7f7fc46918863  # released reference 0.1.4
      implement: https://gustavanderson.notion.site/4056d2e17f5681a4bee6c4d5bc4da0ac  # released reference 0.1.18
      review: https://gustavanderson.notion.site/4056d2e17f5681c1857be250346718f8  # released reference 0.1.18
  defence:
    skill: https://gustavanderson.notion.site/4056d2e17f5681d38bd0feb651c8fd22  # released reference 0.1.4
    scope: authorized-only
  bi: not-yet-packaged
  research: not-yet-packaged

policy:
  source: https://gustavanderson.notion.site/4056d2e17f56819cbe9df834bc7819f0
  reference: references/policy.md  # within policy.source skill, not a repo-root path
  admission: owner-or-explicit-delegate
  delivery: owner-or-explicit-delegate
  review:
    reviewer_count: 2
    roles: [objective-domain-evidence, qualitative-intent-and-outcome]
    overrides: project-or-task-within-mandate-and-stronger-requirements
    blocking: required-reviewers-resolve-blocking-concerns
    independence: fresh-context-each
    criteria: original-accepted-task
  method_changes: concrete-owner-decision-or-explicit-delegation
  limits: agreed-before-execution

evaluation:
  role: evaluator
  benchmarks: []  # none qualified for this recipe
  proposed_experiments:
    - https://github.com/arcitai/factory/issues/97

operations:
  notes: https://gustavanderson.notion.site/4056d2e17f5681a79c09f46f42742989
  automations: disabled-during-qualification  # existing Lab-only 180-minute native schedule retained, not enabled
  maintenance_owner: to-be-decided
  access_and_isolation: qualify-in-native-tools
  owner_contact: project-issues-and-lead-thread  # no direct route selected (#117)
  follow_up: lead-owned-native-trigger-or-named-gap

qualification:
  installed_recipe: bounded-lab-qualification-in-progress
  evidence: https://github.com/arcitai/factory/blob/main/docs/qualification.md
  worker_boundaries: https://github.com/arcitai/factory/issues/32
  native_maintenance: https://github.com/arcitai/factory/issues/34#issuecomment-6613129194
  holds: [general-intake, retirement, issue-114-delivery]
